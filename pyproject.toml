[project]
name = "seldon-system"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2,<3", "python-dotenv>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "jsonschema>=4,<5"]

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["backend.tests*"]
