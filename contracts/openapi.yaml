{
  "openapi": "3.1.0",
  "info": {
    "title": "SELDON SYSTEM",
    "version": "0.1.0"
  },
  "paths": {
    "/api/health": {
      "get": {
        "summary": "Health",
        "operationId": "health_api_health_get",
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ProviderHealth"
                }
              }
            }
          }
        }
      }
    },
    "/api/companies": {
      "get": {
        "summary": "Companies",
        "operationId": "companies_api_companies_get",
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {}
              }
            }
          }
        }
      }
    },
    "/api/research": {
      "post": {
        "summary": "Create Research",
        "operationId": "create_research_api_research_post",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ResearchRequest"
              }
            }
          },
          "required": true
        },
        "responses": {
          "202": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {}
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      }
    },
    "/api/research/{task_id}": {
      "get": {
        "summary": "Get Research",
        "operationId": "get_research_api_research__task_id__get",
        "parameters": [
          {
            "name": "task_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "title": "Task Id"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ResearchTaskStatus"
                }
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      }
    },
    "/api/reports/{report_id}": {
      "get": {
        "summary": "Get Report",
        "operationId": "get_report_api_reports__report_id__get",
        "parameters": [
          {
            "name": "report_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "title": "Report Id"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Report"
                }
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      }
    },
    "/api/settings": {
      "get": {
        "summary": "Get Settings",
        "operationId": "get_settings_api_settings_get",
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SettingsStatus"
                }
              }
            }
          }
        }
      },
      "put": {
        "summary": "Update Settings",
        "operationId": "update_settings_api_settings_put",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/SettingsUpdate"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SettingsStatus"
                }
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      }
    },
    "/api/settings/connections": {
      "post": {
        "summary": "Test Connections",
        "operationId": "test_connections_api_settings_connections_post",
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ConnectionDiagnostics"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "Claim": {
        "properties": {
          "claim_id": {
            "type": "string",
            "title": "Claim Id"
          },
          "text": {
            "type": "string",
            "title": "Text"
          },
          "verification_status": {
            "type": "string",
            "enum": [
              "supported",
              "contradicted",
              "insufficient"
            ],
            "title": "Verification Status"
          },
          "evidence_ids": {
            "items": {
              "type": "string"
            },
            "type": "array",
            "title": "Evidence Ids"
          },
          "limitations": {
            "items": {
              "type": "string"
            },
            "type": "array",
            "title": "Limitations"
          },
          "company_id": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Company Id"
          },
          "metric_name": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Metric Name"
          },
          "numeric_value": {
            "anyOf": [
              {
                "type": "number"
              },
              {
                "type": "null"
              }
            ],
            "title": "Numeric Value"
          },
          "unit": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Unit"
          },
          "period_end": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Period End"
          },
          "period_start": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Period Start"
          },
          "accounting_basis": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Accounting Basis"
          },
          "actual_or_guidance": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Actual Or Guidance"
          },
          "capex_scope": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Capex Scope"
          },
          "claim_type": {
            "anyOf": [
              {
                "type": "string",
                "enum": [
                  "disclosed_fact",
                  "calculation",
                  "analysis",
                  "scenario",
                  "evidence_gap"
                ]
              },
              {
                "type": "null"
              }
            ],
            "title": "Claim Type"
          }
        },
        "type": "object",
        "required": [
          "claim_id",
          "text",
          "verification_status",
          "evidence_ids"
        ],
        "title": "Claim"
      },
      "Company": {
        "properties": {
          "company_id": {
            "type": "string",
            "title": "Company Id"
          },
          "company_name": {
            "type": "string",
            "title": "Company Name"
          },
          "ticker": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Ticker"
          },
          "exchange": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Exchange"
          },
          "country": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Country"
          },
          "cik": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Cik"
          },
          "resolution_status": {
            "type": "string",
            "enum": [
              "resolved",
              "ambiguous",
              "unverified"
            ],
            "title": "Resolution Status"
          }
        },
        "type": "object",
        "required": [
          "company_id",
          "company_name",
          "resolution_status"
        ],
        "title": "Company"
      },
      "ConnectionDiagnostics": {
        "properties": {
          "transport": {
            "additionalProperties": {
              "type": "string"
            },
            "type": "object",
            "title": "Transport"
          },
          "checks": {
            "additionalProperties": {
              "type": "string",
              "enum": [
                "not_configured",
                "reachable",
                "unavailable"
              ]
            },
            "type": "object",
            "title": "Checks"
          },
          "provider_authentication": {
            "type": "string",
            "const": "untested",
            "title": "Provider Authentication"
          },
          "research_ready": {
            "type": "boolean",
            "const": false,
            "title": "Research Ready"
          },
          "paid_request_made": {
            "type": "boolean",
            "const": false,
            "title": "Paid Request Made"
          }
        },
        "type": "object",
        "required": [
          "transport",
          "checks",
          "provider_authentication",
          "research_ready",
          "paid_request_made"
        ],
        "title": "ConnectionDiagnostics"
      },
      "HTTPValidationError": {
        "properties": {
          "detail": {
            "items": {
              "$ref": "#/components/schemas/ValidationError"
            },
            "type": "array",
            "title": "Detail"
          }
        },
        "type": "object",
        "title": "HTTPValidationError"
      },
      "InvestmentAnalysis": {
        "properties": {
          "stance": {
            "type": "string",
            "enum": [
              "bullish",
              "cautiously_bullish",
              "bearish",
              "cautiously_bearish",
              "neutral",
              "provisional_neutral",
              "insufficient"
            ],
            "title": "Stance"
          },
          "confidence": {
            "type": "string",
            "enum": [
              "low",
              "medium",
              "high"
            ],
            "title": "Confidence"
          },
          "points": {
            "items": {
              "$ref": "#/components/schemas/InvestmentPoint"
            },
            "type": "array",
            "maxItems": 16,
            "title": "Points"
          },
          "missing_inputs": {
            "items": {
              "type": "string"
            },
            "type": "array",
            "maxItems": 10,
            "title": "Missing Inputs"
          },
          "narrative": {
            "anyOf": [
              {
                "type": "string",
                "maxLength": 10000
              },
              {
                "type": "null"
              }
            ],
            "title": "Narrative"
          },
          "evidence_coverage": {
            "anyOf": [
              {
                "type": "string",
                "enum": [
                  "financial_and_external",
                  "financial_only",
                  "limited"
                ]
              },
              {
                "type": "null"
              }
            ],
            "title": "Evidence Coverage"
          },
          "observation_reason": {
            "anyOf": [
              {
                "type": "string",
                "maxLength": 700
              },
              {
                "type": "null"
              }
            ],
            "title": "Observation Reason"
          }
        },
        "type": "object",
        "required": [
          "stance",
          "confidence",
          "points",
          "missing_inputs"
        ],
        "title": "InvestmentAnalysis"
      },
      "InvestmentNarrative": {
        "properties": {
          "sections": {
            "items": {
              "$ref": "#/components/schemas/InvestmentNarrativeSection"
            },
            "type": "array",
            "title": "Sections"
          },
          "language": {
            "type": "string",
            "enum": [
              "en",
              "zh"
            ],
            "title": "Language",
            "default": "en"
          }
        },
        "type": "object",
        "required": [
          "sections"
        ],
        "title": "InvestmentNarrative"
      },
      "InvestmentNarrativeSection": {
        "properties": {
          "topic": {
            "type": "string",
            "enum": [
              "thesis",
              "outlook",
              "financial_quality",
              "valuation",
              "bull_case",
              "base_case",
              "bear_case",
              "risk",
              "catalyst",
              "counterargument",
              "invalidation",
              "operating_state",
              "market_expectations",
              "supporting_case",
              "opposing_case",
              "tradeoff",
              "key_factor",
              "horizon"
            ],
            "title": "Topic"
          },
          "text": {
            "type": "string",
            "maxLength": 900,
            "minLength": 1,
            "title": "Text"
          },
          "evidence_ids": {
            "items": {
              "type": "string"
            },
            "type": "array",
            "maxItems": 8,
            "title": "Evidence Ids"
          },
          "review_verdict": {
            "type": "string",
            "title": "Review Verdict",
            "default": "pending"
          },
          "review_reason": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Review Reason"
          },
          "suggested_revision": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Suggested Revision"
          }
        },
        "type": "object",
        "required": [
          "topic",
          "text",
          "evidence_ids"
        ],
        "title": "InvestmentNarrativeSection"
      },
      "InvestmentPoint": {
        "properties": {
          "topic": {
            "type": "string",
            "enum": [
              "thesis",
              "outlook",
              "financial_quality",
              "valuation",
              "bull_case",
              "base_case",
              "bear_case",
              "risk",
              "catalyst",
              "counterargument",
              "invalidation",
              "operating_state",
              "market_expectations",
              "supporting_case",
              "opposing_case",
              "tradeoff",
              "key_factor",
              "horizon"
            ],
            "title": "Topic"
          },
          "text": {
            "type": "string",
            "maxLength": 900,
            "minLength": 1,
            "title": "Text"
          },
          "evidence_ids": {
            "items": {
              "type": "string"
            },
            "type": "array",
            "maxItems": 8,
            "title": "Evidence Ids"
          }
        },
        "type": "object",
        "required": [
          "topic",
          "text",
          "evidence_ids"
        ],
        "title": "InvestmentPoint"
      },
      "InvestmentReviewStatus": {
        "properties": {
          "generation": {
            "type": "string",
            "enum": [
              "generation_completed",
              "generation_partial",
              "generation_failed"
            ],
            "title": "Generation"
          },
          "review": {
            "type": "string",
            "enum": [
              "review_pending",
              "review_running",
              "review_completed",
              "review_partial",
              "review_failed_technical",
              "review_blocked"
            ],
            "title": "Review"
          },
          "opinion": {
            "type": "string",
            "enum": [
              "provisional",
              "approved",
              "evidence_insufficient"
            ],
            "title": "Opinion"
          },
          "verdicts": {
            "additionalProperties": {
              "type": "string"
            },
            "type": "object",
            "title": "Verdicts"
          },
          "reasons": {
            "additionalProperties": {
              "type": "string"
            },
            "type": "object",
            "title": "Reasons"
          },
          "suggested_revisions": {
            "additionalProperties": {
              "type": "string"
            },
            "type": "object",
            "title": "Suggested Revisions"
          },
          "batch_status": {
            "additionalProperties": {
              "type": "string"
            },
            "type": "object",
            "title": "Batch Status"
          }
        },
        "type": "object",
        "required": [
          "generation",
          "review",
          "opinion"
        ],
        "title": "InvestmentReviewStatus"
      },
      "IssuerValuation": {
        "properties": {
          "company_id": {
            "type": "string",
            "title": "Company Id"
          },
          "status": {
            "type": "string",
            "enum": [
              "completed",
              "partial",
              "data_insufficient",
              "not_executed"
            ],
            "title": "Status"
          },
          "price": {
            "anyOf": [
              {
                "type": "number"
              },
              {
                "type": "null"
              }
            ],
            "title": "Price"
          },
          "currency": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Currency"
          },
          "trade_date": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Trade Date"
          },
          "price_source_id": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Price Source Id"
          },
          "measures": {
            "items": {
              "$ref": "#/components/schemas/ValuationMeasure"
            },
            "type": "array",
            "title": "Measures"
          },
          "missing": {
            "items": {
              "type": "string"
            },
            "type": "array",
            "title": "Missing"
          },
          "note": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Note"
          },
          "qualitative": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Qualitative"
          },
          "qualitative_evidence_ids": {
            "items": {
              "type": "string"
            },
            "type": "array",
            "title": "Qualitative Evidence Ids"
          }
        },
        "type": "object",
        "required": [
          "company_id",
          "status"
        ],
        "title": "IssuerValuation"
      },
      "Metric": {
        "properties": {
          "metric_id": {
            "type": "string",
            "title": "Metric Id"
          },
          "company_id": {
            "type": "string",
            "title": "Company Id"
          },
          "metric_name": {
            "type": "string",
            "title": "Metric Name"
          },
          "value": {
            "type": "number",
            "title": "Value"
          },
          "currency": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Currency"
          },
          "unit": {
            "type": "string",
            "title": "Unit"
          },
          "period_start": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Period Start"
          },
          "period_end": {
            "type": "string",
            "title": "Period End"
          },
          "fiscal_period": {
            "type": "string",
            "title": "Fiscal Period"
          },
          "accounting_basis": {
            "type": "string",
            "title": "Accounting Basis"
          },
          "actual_or_guidance": {
            "type": "string",
            "enum": [
              "actual",
              "guidance",
              "analyst_estimate",
              "model_inference"
            ],
            "title": "Actual Or Guidance"
          },
          "evidence_ids": {
            "items": {
              "type": "string"
            },
            "type": "array",
            "title": "Evidence Ids"
          },
          "capex_scope": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Capex Scope"
          },
          "duration_kind": {
            "anyOf": [
              {
                "type": "string",
                "enum": [
                  "quarter",
                  "ytd",
                  "year"
                ]
              },
              {
                "type": "null"
              }
            ],
            "title": "Duration Kind"
          },
          "calculation_method": {
            "anyOf": [
              {
                "type": "string",
                "enum": [
                  "quarter_difference",
                  "operating_cash_flow_less_capex",
                  "growth"
                ]
              },
              {
                "type": "null"
              }
            ],
            "title": "Calculation Method"
          }
        },
        "type": "object",
        "required": [
          "metric_id",
          "company_id",
          "metric_name",
          "value",
          "unit",
          "period_end",
          "fiscal_period",
          "accounting_basis",
          "actual_or_guidance",
          "evidence_ids"
        ],
        "title": "Metric"
      },
      "NewsAnalysis": {
        "properties": {
          "generation_status": {
            "anyOf": [
              {
                "type": "string",
                "enum": [
                  "news_collected",
                  "news_analysis_completed",
                  "synthesis_completed",
                  "generation_truncated",
                  "generation_failed",
                  "budget_unavailable",
                  "evidence_insufficient"
                ]
              },
              {
                "type": "null"
              }
            ],
            "title": "Generation Status"
          },
          "failed_stage": {
            "anyOf": [
              {
                "type": "string",
                "enum": [
                  "analysis",
                  "article"
                ]
              },
              {
                "type": "null"
              }
            ],
            "title": "Failed Stage"
          },
          "status": {
            "type": "string",
            "enum": [
              "completed",
              "partial",
              "search_failed",
              "no_results",
              "not_executed"
            ],
            "title": "Status"
          },
          "overall_assessment": {
            "type": "string",
            "enum": [
              "positive",
              "neutral",
              "cautious",
              "mixed",
              "insufficient"
            ],
            "title": "Overall Assessment",
            "default": "insufficient"
          },
          "confidence": {
            "type": "string",
            "enum": [
              "low",
              "medium"
            ],
            "title": "Confidence",
            "default": "low"
          },
          "as_of": {
            "type": "string",
            "title": "As Of"
